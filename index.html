<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spardha – Free Exam Prep</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef6fb;--card:#fff;--card2:#e3f3f5;--tx:#10243a;--mut:#5b7186;--pr:#0e7c86;--ac:#ff8a1f;--bd:#d3e5ee}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1626;--card:#12263d;--card2:#16324a;--tx:#eaf4fb;--mut:#8fb0c7;--pr:#2dd4bf;--bd:#223f58}}
:root[data-theme="dark"]{--bg:#0a1626;--card:#12263d;--card2:#16324a;--tx:#eaf4fb;--mut:#8fb0c7;--pr:#2dd4bf;--bd:#223f58}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(circle at 0 0,#14b8a633,transparent 45%),radial-gradient(circle at 100% 100%,#ff8a1f26,transparent 45%);background-attachment:fixed;color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(135deg,#0b2c4d,#0e7c86 60%,#19b6a0);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 4px 18px #0b2c4d40;border-bottom:3px solid #ff8a1f}
header h1{font-size:22px;margin:0;flex:1;letter-spacing:.3px}header small{display:block;font-size:11px;opacity:.85;font-weight:400;letter-spacing:0}
button{font:inherit;cursor:pointer}
.btn{background:linear-gradient(135deg,#0e7c86,#14a39a);color:#fff;border:0;border-radius:12px;padding:11px 18px;font-weight:600;box-shadow:0 6px 16px #0e7c8640;transition:transform .15s}.btn:active{transform:scale(.96)}
.btn.alt{background:transparent;color:var(--pr);border:1px solid var(--pr);box-shadow:none}.btn.sm{padding:6px 12px;font-size:13px}
main{max-width:760px;margin:0 auto;padding:16px}
main>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#0b2c4d,#0e7c86,#19b6a0,#0e7c86,#0b2c4d);background-size:300% 300%;animation:shift 9s ease infinite,rise .5s both;color:#fff;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 10px 28px #0e7c8645}
.b{position:absolute;border-radius:50%;background:#ffffff22;animation:drift 7s ease-in-out infinite}.b1{width:120px;height:120px;right:-30px;top:-40px}.b2{width:70px;height:70px;right:70px;bottom:-30px;animation-delay:-3s;background:#ff8a1f44}
.hero>*:not(.b){position:relative}.hero h2{margin:0 0 4px}.hero p{margin:0 0 12px;opacity:.92;font-size:14px}.hero .btn{background:#ff8a1f;color:#2a1400;box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--bd);border-radius:18px;padding:16px;text-align:left;color:var(--tx);transition:transform .2s,box-shadow .2s;animation:pop .55s cubic-bezier(.2,.9,.3,1.3) both}
.tile:hover{transform:translateY(-4px);box-shadow:0 12px 26px #0e7c8630}.tile:active{transform:scale(.97)}
.tile b{display:block;font-size:16px}.tile span{font-size:12px;color:var(--mut)}
.ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:10px;background:linear-gradient(135deg,var(--a),var(--b));animation:float 3s ease-in-out infinite}
.card{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 4px 14px #0b2c4d10}
.dbtn{display:block;width:100%;text-align:left;color:var(--tx);transition:transform .2s,box-shadow .2s}.dbtn:hover{transform:translateX(4px);box-shadow:0 8px 20px #0e7c8625}
.doc{white-space:pre-wrap;line-height:1.8}
.tag{display:inline-block;font-size:11px;background:linear-gradient(135deg,#ff8a1f,#f59e0b);color:#2a1400;border-radius:999px;padding:2px 10px;font-weight:700}
.promo{position:relative;overflow:hidden;border:2px dashed var(--ac);border-radius:16px;padding:12px 14px;margin:0 0 14px;background:linear-gradient(135deg,var(--card),var(--card2))}
.promo:after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:50%;background:linear-gradient(100deg,transparent,#ffffff66,transparent);animation:shine 3.5s infinite}
.pt{transition:opacity .4s;margin-top:4px}.pt b{display:block}.pt span{font-size:12px;color:var(--mut)}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pr)}
label{font-size:13px;color:var(--mut)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);transition:transform .15s}.opt:active{transform:scale(.98)}
.opt.ok{border-color:#16a34a;background:#16a34a33;animation:pop .4s}.opt.no{border-color:#ef4444;background:#ef444433;animation:shake .4s}
.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.mut{color:var(--mut);font-size:13px}.back{background:none;border:0;color:var(--pr);font-weight:600;padding:0 0 8px}
h2{margin:4px 0 8px}h3{margin:14px 0 4px;font-size:15px}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#14b8a6,#ff8a1f);animation:grow .6s ease-out}
.big{font-size:44px;font-weight:800;background:linear-gradient(135deg,#0e7c86,#ff8a1f);-webkit-background-clip:text;background-clip:text;color:transparent}
.pulse{animation:pulse 2s infinite;transform-origin:center;transform-box:fill-box}
.cf{position:fixed;top:-14px;width:9px;height:14px;border-radius:2px;z-index:99;animation:fall 2.6s ease-in forwards;pointer-events:none}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(10px)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-4px)}}
@keyframes shift{50%{background-position:100% 50%}}
@keyframes drift{50%{transform:translate(14px,10px) scale(1.1)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{50%{transform:scale(1.35);opacity:.7}}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@keyframes shine{to{transform:translateX(400%)}}
@keyframes grow{from{transform:scaleX(.2);transform-origin:left}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;color:#fff;background:linear-gradient(120deg,#0b2c4d,#0e7c86,#19b6a0,#0b2c4d);background-size:300% 300%;animation:shift 6s infinite;transition:opacity .5s;overflow:hidden}
.splash .q{max-width:320px;margin:0}.splash .q span{display:inline-block;opacity:0;animation:rise .6s forwards;font-size:22px;font-weight:700}
.rk{font-size:68px;animation:launch 2.2s ease-out both}.splash small{opacity:.8}
.ring{position:absolute;border:2px solid #ffffff55;border-radius:50%;animation:ripple 3s infinite}.r1{width:220px;height:220px}.r2{width:340px;height:340px;animation-delay:1s}
.sb{width:200px;height:6px;background:#ffffff33;border-radius:9px;overflow:hidden}.sb i{display:block;height:100%;background:#ff8a1f;animation:fill 4.6s linear forwards}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#10243a;color:#fff;padding:10px 16px;border-radius:999px;z-index:60;max-width:90vw;text-align:center;animation:rise .3s both}
.sbox input{margin-bottom:6px}#sr .card{margin:6px 0;padding:10px 14px}.lock{opacity:.7}.seg{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:5px 13px;font-size:13px}.chip.on{background:linear-gradient(135deg,#0e7c86,#14a39a);color:#fff;border-color:transparent}
details>summary{cursor:pointer;list-style:none}details[open]{animation:pop .3s}details ul{padding-left:18px;margin:6px 0}.ex{background:var(--card2);border-radius:10px;padding:8px 10px;font-size:13px}
.pod{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:10px;height:260px;margin:16px 0;padding-top:30px}
.spot{position:absolute;left:50%;top:0;width:220px;height:100%;transform:translateX(-50%);background:radial-gradient(ellipse at top,#ffd84d66,transparent 70%);animation:glow 2.5s infinite;pointer-events:none}
.pc{flex:1;max-width:120px;text-align:center;position:relative}.pn{font-size:12px;margin-bottom:4px;opacity:0;animation:rise .6s both;word-break:break-word}.pn b{font-size:15px}
.tr{font-size:30px;animation:bounce 1.2s infinite}.pbar{border-radius:12px 12px 0 0;display:flex;justify-content:center;padding-top:8px;font-size:30px;transform-origin:bottom;animation:barup 1s cubic-bezier(.2,.9,.3,1.2) both;box-shadow:0 8px 20px #0003}
@keyframes launch{from{transform:translateY(120px) scale(.6);opacity:0}60%{transform:translateY(-12px)}to{transform:none;opacity:1}}
@keyframes ripple{from{transform:scale(.4);opacity:.9}to{transform:scale(1.6);opacity:0}}
@keyframes fill{from{width:0}to{width:100%}}
@keyframes barup{from{transform:scaleY(0)}}
@keyframes bounce{50%{transform:translateY(-8px) rotate(8deg)}}
@keyframes glow{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.splash .q span,.pn{opacity:1!important}}
</style></head><body>
<header>
<svg width="46" height="46" viewBox="0 0 64 64" aria-label="Spardha logo"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#19b6a0"/><stop offset="1" stop-color="#0b2c4d"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#lg)"/><text x="30" y="47" text-anchor="middle" font-size="42" font-weight="900" fill="#fff" font-family="system-ui,Segoe UI,Arial,sans-serif">S</text><circle class="pulse" cx="48" cy="16" r="5.5" fill="#ff8a1f"/></svg>
<h1>Spardha<small>ಸ್ಪರ್ಧಾ · Free exam prep for Karnataka &amp; central exams</small></h1>
<button class="btn sm alt" id="st" style="display:none;color:#fff;border-color:#fff">⚙️</button><button class="btn sm alt" id="out" style="display:none;color:#fff;border-color:#fff">Logout</button>
</header>
<main id="app"></main>
<script>
var $=function(s){return document.querySelector(s)};
var app=$('#app'),S={user:null,notes:[],scores:{}};
function load(){try{var d=JSON.parse(localStorage.getItem('guri')||'null');if(d)S=d}catch(e){}}
function save(){try{localStorage.setItem('guri',JSON.stringify(S))}catch(e){}}
function today(){return new Date().toISOString().slice(0,10)}
var EXAMS=['KPSC (KAS/FDA/SDA)','KEA (PSI/PC/VAO etc.)','KPSC Group C / Others','UPSC','SSC (CGL/CHSL/MTS)','Banking (IBPS/SBI)','Railways (RRB)','Other'];
var CA=[['Karnataka','Sample: Karnataka govt scheme updates will appear here daily'],['National','Sample: Union Budget, Supreme Court rulings and policy news will appear here'],['International','Sample: Summits, treaties and global rankings will appear here'],['Awards','Sample: Awards, appointments and sports news will appear here']];
var Q=[
['Karnataka Rajyotsava is celebrated on which date?',['1 October','1 November','1 December','26 January'],1],
['Gol Gumbaz is located in which district?',['Vijayapura','Mysuru','Hassan','Ballari'],0],
['Article 21 of the Constitution deals with?',['Right to equality','Freedom of speech','Right to life and personal liberty','Right to property'],2],
['Jog Falls is formed by which river?',['Kaveri','Sharavati','Tungabhadra','Krishna'],1],
['Who is the constitutional head of a state in India?',['Chief Minister','Governor','Speaker','Chief Justice'],1],
['Highest peak in Karnataka is?',['Kudremukh','Mullayanagiri','Tadiandamol','Kumara Parvata'],1],
['Who chaired the Drafting Committee of the Constitution?',['Nehru','B.R. Ambedkar','Patel','Gandhi'],1],
['Hampi was the capital of which empire?',['Hoysala','Chalukya','Vijayanagara','Kadamba'],2],
['State bird of Karnataka is?',['Peacock','Indian Roller','Sparrow','Parrot'],1],
['Fundamental Duties were added by which Amendment?',['42nd','44th','52nd','73rd'],0],
['Which river is called "Dakshina Ganga"?',['Krishna','Kaveri','Godavari','Tungabhadra'],1],
['Badami was the capital of which dynasty?',['Rashtrakuta','Chalukyas','Hoysalas','Gangas'],1],
['How many districts does Karnataka have?',['28','30','31','33'],2],
['The RBI was established in?',['1925','1935','1947','1950'],1],
['Chemical symbol of Gold is?',['Au','Ag','Gd','Go'],0],
['Powerhouse of the cell is?',['Nucleus','Mitochondria','Ribosome','Golgi body'],1],
['Which planet is known as the Red Planet?',['Venus','Mars','Jupiter','Saturn'],1],
['First woman President of India?',['Indira Gandhi','Sarojini Naidu','Pratibha Patil','Droupadi Murmu'],2],
['GST came into effect on?',['1 Apr 2016','1 Jul 2017','1 Jan 2018','15 Aug 2017'],1],
['Who wrote "Sri Ramayana Darshanam"?',['Kuvempu','D.R. Bendre','Masti','Shivarama Karanth'],0],
['How many Jnanpith Awards has Kannada won?',['5','6','8','10'],2],
['If 20% of a number is 40, the number is?',['100','150','200','250'],2],
['Series: 2, 6, 12, 20, 30, ?',['38','40','42','44'],2],
['CPU stands for?',['Central Processing Unit','Control Program Unit','Central Program Utility','Computer Personal Unit'],0],
['KEA stands for?',['Karnataka Examinations Authority','Karnataka Education Academy','Karnataka Exam Association','Kannada Examination Agency'],0]];
var T=Q.length,NAMES=['Ravi K','Ananya S','Manjunath','Pooja R','Shivu','Deepa','Kiran','Lakshmi','Suresh','Divya'];
function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function board(){var d=today(),l=NAMES.map(function(n){return{n:n,s:6+hash(d+n)%16}});if(S.user&&S.scores[d]!=null)l.push({n:S.user.name,s:S.scores[d],me:1});return l.sort(function(a,b){return b.s-a.s})}
function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}
function back(){return '<button class="back" onclick="home()">← Home</button>'}
var WM='<i class="b b1"></i><i class="b b2"></i>';
function auth(){$('#out').style.display='none';app.innerHTML='<div class="hero">'+WM+'<h2>Prepare. Compete. Win! 🎯</h2><p>100% free preparation for KPSC, KEA and central government exams.</p></div><div class="card"><label>Full name</label><input id="n"><label>Email or mobile</label><input id="e"><label>Target exam</label><select id="x">'+EXAMS.map(function(x){return '<option>'+x+'</option>'}).join('')+'</select><label>District</label><input id="d" placeholder="e.g. Dharwad"><button class="btn" style="width:100%" onclick="signup()">Create profile</button></div>'}
function signup(){var n=$('#n').value.trim(),e=$('#e').value.trim();if(!n||!e){alert('Please enter name and email/mobile');return}S.user={name:n,id:e,exam:$('#x').value,district:$('#d').value.trim()};save();home()}
function home(){stop();$('#out').style.display='';var u=S.user,done=S.scores[today()]!=null;
var t=[['📰','Current Affairs','Daily updates','ca','#14b8a6','#0e7c86'],['📚','Study Materials','Notes and documents','mat','#3b82f6','#1d4ed8'],['🧠','Daily Quiz',T+' questions','quiz','#ff8a1f','#f59e0b'],['📝','My Notes','Write and save','notes','#22c55e','#15803d'],['⏳','Exam Countdown','Days left','cd','#ec4899','#be185d'],['⏱️','Focus Timer','25-min sessions','timer','#6366f1','#4338ca'],['🏆','Daily Winners','Leaderboard','win','#f59e0b','#d97706'],['👤','My Profile','Your details','prof','#0ea5e9','#0369a1'],['🏛️','Namma Karnataka','Know your state: facts, heritage and pride','nk','#14b8a6','#3b82f6']];
app.innerHTML='<div class="hero">'+WM+'<h2>Namaskara, '+esc(u.name)+'!</h2><p>Preparing for <b>'+esc(u.exam)+'</b> · 🔥 '+streak()+'-day streak</p><button class="btn" onclick="go(\'quiz\')">'+(done?'View today\'s result':'Start today\'s quiz →')+'</button></div>'+promo()+'<div class="grid">'+t.map(function(x,i){return '<button class="tile" style="animation-delay:'+(i*70)+'ms'+(x[3]=='nk'?';grid-column:span 2':'')+'" onclick="go(\''+x[3]+'\')"><div class="ic" style="--a:'+x[4]+';--b:'+x[5]+'">'+x[0]+'</div><b>'+x[1]+'</b><span>'+x[2]+'</span></button>'}).join('')+'</div>'}
function go(v){stop();window[v+'V']()}
function caV(){app.innerHTML=back()+'<h2>Current Affairs · '+today()+'</h2>'+CA.map(function(c){return '<div class="card"><span class="tag">'+c[0]+'</span><p>'+c[1]+'</p></div>'}).join('')}
function notesV(){app.innerHTML=back()+'<h2>My Notes</h2><textarea id="t" rows="3" placeholder="Write a note..."></textarea><button class="btn" onclick="addNote()">Save note</button>'+S.notes.map(function(n,i){return '<div class="card"><div class="doc">'+esc(n)+'</div><div style="margin-top:8px"><button class="btn sm alt" onclick="delNote('+i+')">Delete</button></div></div>'}).join('')}
function addNote(){var v=$('#t').value.trim();if(v){S.notes.unshift(v);save();notesV()}}
function delNote(i){S.notes.splice(i,1);save();notesV()}
var qi=0,qs=0,ans=false;
function quizV(){var s=S.scores[today()];if(s!=null){var m=s>=20?'Excellent! 🔥':s>=13?'Good job! Keep going 💪':'Keep practising, you will improve 🌱';app.innerHTML=back()+'<h2>Daily Quiz</h2><div class="card" style="text-align:center"><div class="big">'+s+'/'+T+'</div><p>'+m+'</p><p class="mut">New quiz tomorrow.</p><button class="btn" onclick="go(\'win\')">See winners</button></div>';if(s>=18)setTimeout(confetti,200);return}qi=0;qs=0;showQ()}
function showQ(){ans=false;var q=Q[qi];app.innerHTML=back()+'<h2>Daily Quiz</h2><p class="mut">Question '+(qi+1)+' of '+T+'</p><div class="bar"><i style="width:'+(qi/T*100)+'%"></i></div><div class="card"><b>'+q[0]+'</b>'+q[1].map(function(o,i){return '<button class="opt" onclick="pick('+i+',this)">'+o+'</button>'}).join('')+'</div>'}
function pick(i,b){if(ans)return;ans=true;var q=Q[qi];document.querySelectorAll('.opt')[q[2]].classList.add('ok');if(i==q[2])qs++;else b.classList.add('no');var nb=document.createElement('button');nb.className='btn';nb.textContent=qi<T-1?'Next →':'Finish';nb.onclick=function(){qi++;if(qi<T)showQ();else{S.scores[today()]=qs;recordWin();save();quizV()}};b.parentNode.appendChild(nb)}
function winV(){var b=board(),m=['🥇','🥈','🥉'];app.innerHTML=back()+'<h2>Daily Winners · '+today()+'</h2><div class="card"><span class="tag">Winner today</span> <b>'+esc(b[0].n)+'</b> – '+b[0].s+'/'+T+'</div><div class="card">'+b.slice(0,10).map(function(x,i){return '<div class="row"><span>'+(m[i]||(i+1)+'.')+' '+esc(x.n)+'</span><b>'+x.s+'/'+T+'</b></div>'}).join('')+'</div><p class="mut">Demo leaderboard: other names are sample data until a shared database is connected.</p>'}
function profV(){var u=S.user;app.innerHTML=back()+'<h2>My Profile</h2><div class="card"><div class="row"><span>Name</span><b>'+esc(u.name)+'</b></div><div class="row"><span>Contact</span><b>'+esc(u.id)+'</b></div><div class="row"><span>Exam</span><b>'+esc(u.exam)+'</b></div><div class="row"><span>District</span><b>'+esc(u.district||'-')+'</b></div></div>'}
var tm=0,left=1500;
function stop(){clearInterval(tm);tm=0;clearInterval(pm)}
function streak(){var d=new Date(),c=0;if(S.scores[d.toISOString().slice(0,10)]==null)d.setDate(d.getDate()-1);while(S.scores[d.toISOString().slice(0,10)]!=null){c++;d.setDate(d.getDate()-1)}return c}
function cdV(){var e=S.exam,h=back()+'<h2>Exam Countdown ⏳</h2>';if(e){var n=Math.ceil((new Date(e.date)-new Date(today()))/864e5);h+='<div class="card" style="text-align:center"><div class="big">'+Math.max(n,0)+'</div><p>days left for <b>'+esc(e.name)+'</b></p><p class="mut">'+(n>0?'Study a little every day. You will get there!':'All the best! 🙏')+'</p></div>'}
app.innerHTML=h+'<div class="card"><label>Exam name</label><input id="cn" value="'+esc(e?e.name:S.user.exam)+'"><label>Exam date</label><input id="cd" type="date" value="'+(e?e.date:'')+'"><button class="btn" onclick="setCd()">Set countdown</button></div>'}
function setCd(){var n=$('#cn').value.trim(),d=$('#cd').value;if(!n||!d){alert('Enter exam name and date');return}S.exam={name:n,date:d};save();cdV()}

var LONGN={"polity": ["Indian Polity: Complete Notes", "1. MAKING OF THE CONSTITUTION\nThe Constituent Assembly first met on 9 December 1946 with Dr. Rajendra Prasad as its permanent President, and Dr. B.R. Ambedkar chaired the Drafting Committee. The Constitution was adopted on 26 November 1949 and came into force on 26 January 1950. Originally it had 395 Articles, 22 Parts and 8 Schedules; today it has 12 Schedules. Sources were borrowed widely: the parliamentary system from Britain, Fundamental Rights from the USA, Directive Principles from Ireland, the federal scheme with a strong centre from Canada, and the Concurrent List from Australia.\n\n2. PREAMBLE\nThe Preamble declares India a Sovereign, Socialist, Secular, Democratic, Republic. The words Socialist and Secular were added by the 42nd Amendment (1976). It secures Justice, Liberty, Equality and Fraternity. The Supreme Court in the Kesavananda Bharati case (1973) held that the Preamble is part of the Constitution and that Parliament cannot alter its basic structure.\n\n3. FUNDAMENTAL RIGHTS (PART III, ARTICLES 12-35)\nThere are six Fundamental Rights: Right to Equality (14-18), Right to Freedom (19-22), Right against Exploitation (23-24), Right to Freedom of Religion (25-28), Cultural and Educational Rights (29-30) and Right to Constitutional Remedies (32). Article 21 protects life and personal liberty, and Article 21A (86th Amendment, 2002) provides free and compulsory education for children aged 6 to 14. Dr. Ambedkar called Article 32 the heart and soul of the Constitution. Writs available are Habeas Corpus, Mandamus, Prohibition, Certiorari and Quo Warranto.\n\n4. DIRECTIVE PRINCIPLES AND FUNDAMENTAL DUTIES\nDirective Principles are in Part IV (Articles 36-51) and are non-justiciable guidelines for the state, such as equal pay for equal work, village panchayats (Article 40) and a uniform civil code (Article 44). Fundamental Duties are in Part IVA, Article 51A, added by the 42nd Amendment on the Swaran Singh Committee recommendation. Originally there were 10 duties; the 86th Amendment added an 11th duty relating to education of children.\n\n5. UNION EXECUTIVE\nThe President is the head of the Union and is elected indirectly by an electoral college of elected members of Parliament and State Legislative Assemblies for a 5-year term. The minimum age is 35. The Vice-President is the ex-officio Chairman of the Rajya Sabha. The Prime Minister heads the Council of Ministers, which is collectively responsible to the Lok Sabha under Article 75. The Attorney General (Article 76) is the highest law officer of India.\n\n6. PARLIAMENT\nParliament consists of the President, Rajya Sabha and Lok Sabha. The Lok Sabha has a maximum of 552 members and a 5-year term. The Rajya Sabha has a maximum of 250 members, is a permanent house, and one-third of its members retire every two years. A Money Bill can be introduced only in the Lok Sabha. The Speaker presides over the Lok Sabha. Joint sittings under Article 108 are presided over by the Speaker.\n\n7. JUDICIARY\nThe Supreme Court is the apex court and has original, appellate and advisory jurisdiction. High Courts exist in every state or group of states under Article 214. Judges of the Supreme Court retire at 65 and High Court judges at 62. Public Interest Litigation allows any citizen to approach the court for public causes. Subordinate courts are supervised by the High Court under Article 235.\n\n8. STATE GOVERNMENT AND LOCAL BODIES\nThe Governor is appointed by the President (Article 155) and the Chief Minister heads the Council of Ministers responsible to the Legislative Assembly (Article 164). Karnataka has a bicameral legislature with 224 Assembly members. The 73rd Amendment (1992) gave constitutional status to Panchayati Raj and the 74th Amendment gave it to urban local bodies. The State Election Commission conducts local body elections.\n\n9. CONSTITUTIONAL BODIES AND EMERGENCY\nConstitutional bodies include the Election Commission (Article 324), UPSC (Article 315), State PSC, Finance Commission (Article 280) and CAG (Article 148). Emergency provisions are in Part XVIII: National Emergency (Article 352), President's Rule in a state (Article 356) and Financial Emergency (Article 360). The 44th Amendment (1978) restricted misuse of national emergency by replacing internal disturbance with armed rebellion.\n\n10. EXAM TIPS\nMemorise Article numbers with themes, prepare an amendment list (7th, 42nd, 44th, 52nd, 73rd, 74th, 86th, 101st), and revise landmark cases such as Kesavananda Bharati, Maneka Gandhi and Minerva Mills. Practise 10 polity MCQs daily from previous KPSC, KEA and SSC papers."], "kar": ["Karnataka History and Culture: Complete Notes", "1. EARLY KARNATAKA\nKarnataka has Stone Age and Megalithic sites such as Hire Benakal and Brahmagiri. Ashokan edicts at Maski, Brahmagiri and Siddapura show Mauryan influence in the region. The Satavahanas ruled parts of northern Karnataka before local dynasties emerged.\n\n2. KADAMBAS AND GANGAS\nThe Kadambas of Banavasi, founded by Mayurasharma in the 4th century, were the first Kannada royal dynasty and made Kannada an administrative language. The Western Gangas of Talakadu ruled from the 4th to 11th century. Chavundaraya, a Ganga minister, built the Gommateshwara monolith at Shravanabelagola around 981 CE.\n\n3. CHALUKYAS OF BADAMI\nPulakeshi II (7th century) was the greatest Chalukya ruler and defeated Harshavardhana on the banks of the Narmada. The Aihole inscription by Ravikirti records his victories. Temple architecture flourished at Badami, Aihole and Pattadakal, and Pattadakal is a UNESCO World Heritage Site. Vikramaditya II's queens built the Virupaksha and Mallikarjuna temples.\n\n4. RASHTRAKUTAS\nThe Rashtrakutas of Manyakheta, founded by Dantidurga, built the Kailasa temple at Ellora under Krishna I. Amoghavarsha I is linked with Kavirajamarga, the earliest available Kannada literary work. Their rule marks a golden age of Kannada literature.\n\n5. LATER CHALUKYAS, HOYSALAS AND KALACHURIS\nThe Western Chalukyas of Kalyana ruled from Basavakalyana. Vikramaditya VI was a great ruler, and Bilhana and Vijnaneshwara adorned his court. The Hoysalas, with capitals at Belur and Halebidu and Vishnuvardhana as the best known king, built star-shaped temples such as Chennakeshava (Belur), Hoysaleshwara (Halebidu) and Keshava (Somanathapura). Basavanna, a minister under the Kalachuris, led the Lingayat movement and Vachana literature.\n\n6. VIJAYANAGARA EMPIRE\nFounded in 1336 by Harihara and Bukka with Vidyaranya's inspiration, with its capital at Hampi. Krishnadevaraya (1509-1529) was the greatest ruler, called Kannada Rajya Rama Ramana, and wrote Amuktamalyada in Telugu. Foreign travellers Domingo Paes, Nuniz and Abdur Razzak visited. The empire fell after the Battle of Talikota in 1565.\n\n7. BAHMANI, ADILSHAHIS, MYSORE AND MODERN KARNATAKA\nThe Bahmani Sultanate and later Bijapur Adilshahis built monuments such as Gol Gumbaz, whose dome is among the largest in the world. The Wodeyars of Mysore ruled for centuries, and Hyder Ali and Tipu Sultan (killed in 1799 in the Fourth Anglo-Mysore War) resisted the British. The Unification movement led to the formation of Karnataka on 1 November 1956 and the name Karnataka was adopted in 1973.\n\n8. CULTURE AND LITERATURE\nPampa, Ponna and Ranna are the Ratnatraya of Kannada literature. Basavanna, Akka Mahadevi and Allama Prabhu are key Vachanakaras. Haridasa literature was led by Purandara Dasa, the father of Carnatic music, and Kanaka Dasa. Modern greats include Kuvempu, Bendre, Shivarama Karanth, Masti, Gokak, U.R. Ananthamurthy, Girish Karnad and Chandrashekhara Kambara, who together won 8 Jnanpith Awards. Yakshagana is the traditional theatre of coastal Karnataka, and Mysuru Dasara is the state festival.\n\n9. EXAM TIPS\nMake a dynasty table with founder, capital, best ruler and monuments. Remember the sequence Kadambas, Gangas, Chalukyas, Rashtrakutas, Hoysalas, Vijayanagara. Revise UNESCO sites of Karnataka: Hampi, Pattadakal, the Western Ghats and the Hoysala temples."]};

KN["Indian Geography: Quick Facts"]=["ಭಾರತದ ಭೂಗೋಳ: ತ್ವರಿತ ಮಾಹಿತಿ","• ಗಂಗಾ ಭಾರತದ ಅತಿ ಉದ್ದದ ನದಿ; ಗೋದಾವರಿ ಪರ್ಯಾಯ ದ್ವೀಪದ ಅತಿ ಉದ್ದದ ನದಿ.\n• ಕಾಂಚನಜುಂಗಾ ಭಾರತದ ಅತಿ ಎತ್ತರದ ಶಿಖರ.\n• ಆನೈಮುಡಿ (ಕೇರಳ) ಪಶ್ಚಿಮ ಘಟ್ಟಗಳ ಅತಿ ಎತ್ತರದ ಶಿಖರ.\n• ಕರ್ಕಾಟಕ ಸಂಕ್ರಾಂತಿ ವೃತ್ತ 8 ರಾಜ್ಯಗಳ ಮೂಲಕ ಹಾದುಹೋಗುತ್ತದೆ.\n• ಥಾರ್ ಮರುಭೂಮಿ ರಾಜಸ್ಥಾನದಲ್ಲಿದೆ."];
KN["English Grammar Basics"]=["ಇಂಗ್ಲಿಷ್ ವ್ಯಾಕರಣ ಮೂಲಭೂತ ಅಂಶಗಳು","• 8 ಪದಭೇದಗಳು: noun (ನಾಮಪದ), pronoun (ಸರ್ವನಾಮ), verb (ಕ್ರಿಯಾಪದ), adjective (ಗುಣವಾಚಕ), adverb (ಕ್ರಿಯಾವಿಶೇಷಣ), preposition (ಉಪಸರ್ಗ), conjunction (ಸಂಯೋಜಕ), interjection (ಭಾವಸೂಚಕ).\n• 12 ಕಾಲಗಳು: ವರ್ತಮಾನ, ಭೂತ, ಭವಿಷ್ಯ ತಲಾ 4.\n• ಕರ್ತೃ-ಕ್ರಿಯಾಪದ ಹೊಂದಾಣಿಕೆ: ಏಕವಚನ ಕರ್ತೃವಿಗೆ ಏಕವಚನ ಕ್ರಿಯಾಪದ.\n• ಸ್ವರ ಧ್ವನಿಯ ಮೊದಲು \"an\", ವ್ಯಂಜನ ಧ್ವನಿಯ ಮೊದಲು \"a\"."];
KN["Key Maths Formulas"]=["ಪ್ರಮುಖ ಗಣಿತ ಸೂತ್ರಗಳು","• ಲಾಭ % = (ಲಾಭ ÷ CP) × 100\n• SP = CP × (100 + ಲಾಭ%) ÷ 100\n• ಸರಳ ಬಡ್ಡಿ = P × R × T ÷ 100\n• ಚಕ್ರಬಡ್ಡಿ ಮೊತ್ತ = P (1 + R/100)^n\n• ವೇಗ = ದೂರ ÷ ಸಮಯ; km/h ನಿಂದ m/s: × 5/18\n• ಸರಾಸರಿ = ಮೊತ್ತ ÷ ಸಂಖ್ಯೆ"];
KN["Reasoning Tips"]=["ತರ್ಕ ಸಲಹೆಗಳು","• ಸರಣಿ: ವ್ಯತ್ಯಾಸ, ವರ್ಗ, ಘನ ಮತ್ತು ಪರ್ಯಾಯ ಮಾದರಿಗಳನ್ನು ಗಮನಿಸಿ.\n• ರಕ್ತ ಸಂಬಂಧ: ಕುಟುಂಬ ವೃಕ್ಷ ಬರೆಯಿರಿ.\n• ದಿಕ್ಕು ಜ್ಞಾನ: N, E, S, W ಬಳಸಿ ಮಾರ್ಗವನ್ನು ಚಿತ್ರಿಸಿ.\n• ಕೋಡಿಂಗ್-ಡಿಕೋಡಿಂಗ್: ಅಕ್ಷರ ಸ್ಥಾನಗಳನ್ನು ಬಳಸಿ (A=1 ... Z=26)."];
KN["How to Use Previous Papers"]=["ಹಿಂದಿನ ಪ್ರಶ್ನೆಪತ್ರಿಕೆಗಳನ್ನು ಹೇಗೆ ಬಳಸುವುದು","• ಒಂದು ಪತ್ರಿಕೆಯನ್ನು ಪರೀಕ್ಷೆಯ ಸಮಯದಲ್ಲೇ, ವಿರಾಮವಿಲ್ಲದೆ ಬಿಡಿಸಿ.\n• ವರ್ಷಗಳಲ್ಲಿ ಪುನರಾವರ್ತನೆಯಾಗುವ ಪ್ರಶ್ನೆಗಳನ್ನು ಗುರುತಿಸಿ.\n• ಪ್ರತಿ ತಪ್ಪು ಉತ್ತರವನ್ನು ಪರಿಶೀಲಿಸಿ, ಪರಿಕಲ್ಪನೆಯನ್ನು ಬರೆದಿಡಿ.\n• ನಿಜವಾದ KPSC, KEA ಮತ್ತು SSC ಪ್ರಶ್ನೆಪತ್ರಿಕೆ PDF ಗಳನ್ನು ಶೀಘ್ರದಲ್ಲೇ ಇಲ್ಲಿ ಸೇರಿಸಲಾಗುವುದು."];
KN["Key Articles Cheat Sheet"]=["ಪ್ರಮುಖ ವಿಧಿಗಳ ಚೀಟ್ ಶೀಟ್","• ವಿಧಿ 14: ಕಾನೂನಿನ ಮುಂದೆ ಸಮಾನತೆ\n• ವಿಧಿ 15: ತಾರತಮ್ಯ ನಿಷೇಧ\n• ವಿಧಿ 17: ಅಸ್ಪೃಶ್ಯತೆ ನಿರ್ಮೂಲನೆ\n• ವಿಧಿ 19: ಆರು ಸ್ವಾತಂತ್ರ್ಯಗಳು\n• ವಿಧಿ 21: ಜೀವ ಮತ್ತು ವೈಯಕ್ತಿಕ ಸ್ವಾತಂತ್ರ್ಯ\n• ವಿಧಿ 21A: ಶಿಕ್ಷಣ (6-14 ವರ್ಷ)\n• ವಿಧಿ 32: ಸಾಂವಿಧಾನಿಕ ಪರಿಹಾರ\n• ವಿಧಿ 40: ಗ್ರಾಮ ಪಂಚಾಯತ್\n• ವಿಧಿ 44: ಏಕರೂಪ ನಾಗರಿಕ ಸಂಹಿತೆ\n• ವಿಧಿ 51A: ಮೂಲಭೂತ ಕರ್ತವ್ಯಗಳು\n• ವಿಧಿ 72: ರಾಷ್ಟ್ರಪತಿಯ ಕ್ಷಮಾದಾನ ಅಧಿಕಾರ\n• ವಿಧಿ 110: ಹಣ ಮಸೂದೆ\n• ವಿಧಿ 123: ಸುಗ್ರೀವಾಜ್ಞೆಗಳು\n• ವಿಧಿ 148: CAG\n• ವಿಧಿ 280: ಹಣಕಾಸು ಆಯೋಗ\n• ವಿಧಿ 324: ಚುನಾವಣಾ ಆಯೋಗ\n• ವಿಧಿ 352: ರಾಷ್ಟ್ರೀಯ ತುರ್ತುಪರಿಸ್ಥಿತಿ\n• ವಿಧಿ 356: ರಾಷ್ಟ್ರಪತಿ ಆಳ್ವಿಕೆ\n• ವಿಧಿ 368: ಸಂವಿಧಾನ ತಿದ್ದುಪಡಿ"];
KN["Karnataka Monuments Quick Sheet"]=["ಕರ್ನಾಟಕ ಸ್ಮಾರಕಗಳ ತ್ವರಿತ ಪಟ್ಟಿ","• ಹಂಪಿ: ವಿರೂಪಾಕ್ಷ ದೇವಾಲಯ, ವಿಠ್ಠಲ ದೇವಾಲಯ (ಕಲ್ಲಿನ ರಥ)\n• ಪಟ್ಟದಕಲ್ಲು: ವಿರೂಪಾಕ್ಷ ಮತ್ತು ಪಾಪನಾಥ ದೇವಾಲಯಗಳು (ಯುನೆಸ್ಕೋ)\n• ಐಹೊಳೆ: ದುರ್ಗಾ ದೇವಾಲಯ, ಲಾಡ್ ಖಾನ್ ದೇವಾಲಯ\n• ಬಾದಾಮಿ: ಗುಹಾ ದೇವಾಲಯಗಳು\n• ಬೇಲೂರು: ಚೆನ್ನಕೇಶವ ದೇವಾಲಯ\n• ಹಳೇಬೀಡು: ಹೊಯ್ಸಳೇಶ್ವರ ದೇವಾಲಯ\n• ಸೋಮನಾಥಪುರ: ಕೇಶವ ದೇವಾಲಯ\n• ಶ್ರವಣಬೆಳಗೊಳ: ಗೊಮ್ಮಟೇಶ್ವರ ಏಕಶಿಲಾ ಮೂರ್ತಿ\n• ವಿಜಯಪುರ: ಗೋಲ ಗುಮ್ಮಟ\n• ಮೈಸೂರು: ಮೈಸೂರು ಅರಮನೆ, ದಸರಾ"];
KN["Maths Speed Tricks"]=["ಗಣಿತ ವೇಗದ ಸೂತ್ರಗಳು","• 5ರಲ್ಲಿ ಕೊನೆಗೊಳ್ಳುವ ಸಂಖ್ಯೆಯ ವರ್ಗ: n5² = n × (n+1), ನಂತರ 25 ಬರೆಯಿರಿ (35² = 1225)\n• y ರ x% = x ರ y%\n• ಅನುಕ್ರಮ ರಿಯಾಯಿತಿ a% ಮತ್ತು b%: a + b - ab/100\n• ಸಮಾನ ದೂರಕ್ಕೆ ಸರಾಸರಿ ವೇಗ: 2xy ÷ (x + y)\n• ಇಬ್ಬರು ಒಂದು ಕೆಲಸವನ್ನು a ಮತ್ತು b ದಿನಗಳಲ್ಲಿ ಮುಗಿಸಿದರೆ, ಒಟ್ಟಿಗೆ: ab ÷ (a + b) ದಿನಗಳು\n• 12.5% = 1/8, 16.67% = 1/6, 33.33% = 1/3, 66.67% = 2/3"];
KN["Indian Polity: Complete Notes"]=["ಭಾರತದ ರಾಜ್ಯಶಾಸ್ತ್ರ: ಸಂಪೂರ್ಣ ಟಿಪ್ಪಣಿಗಳು","೧. ಸಂವಿಧಾನ ರಚನೆ\nಸಂವಿಧಾನ ಸಭೆ ಮೊದಲ ಬಾರಿಗೆ 9 ಡಿಸೆಂಬರ್ 1946 ರಂದು ಸೇರಿತು; ಡಾ. ರಾಜೇಂದ್ರ ಪ್ರಸಾದ್ ಅದರ ಖಾಯಂ ಅಧ್ಯಕ್ಷರು ಮತ್ತು ಡಾ. ಬಿ.ಆರ್. ಅಂಬೇಡ್ಕರ್ ಕರಡು ಸಮಿತಿಯ ಅಧ್ಯಕ್ಷರು. ಸಂವಿಧಾನವನ್ನು 26 ನವೆಂಬರ್ 1949 ರಂದು ಅಂಗೀಕರಿಸಿ 26 ಜನವರಿ 1950 ರಂದು ಜಾರಿಗೆ ತರಲಾಯಿತು. ಮೂಲತಃ 395 ವಿಧಿಗಳು, 22 ಭಾಗಗಳು ಮತ್ತು 8 ಅನುಸೂಚಿಗಳಿದ್ದವು; ಈಗ 12 ಅನುಸೂಚಿಗಳಿವೆ. ಸಂಸದೀಯ ವ್ಯವಸ್ಥೆ ಬ್ರಿಟನ್‌ನಿಂದ, ಮೂಲಭೂತ ಹಕ್ಕುಗಳು ಅಮೆರಿಕದಿಂದ, ನಿರ್ದೇಶಕ ತತ್ವಗಳು ಐರ್ಲೆಂಡ್‌ನಿಂದ, ಬಲಿಷ್ಠ ಕೇಂದ್ರವಿರುವ ಒಕ್ಕೂಟ ವ್ಯವಸ್ಥೆ ಕೆನಡಾದಿಂದ ಮತ್ತು ಸಮವರ್ತಿ ಪಟ್ಟಿ ಆಸ್ಟ್ರೇಲಿಯಾದಿಂದ ಎರವಲು ಪಡೆದವು.\n\n೨. ಪ್ರಸ್ತಾವನೆ\nಪ್ರಸ್ತಾವನೆಯು ಭಾರತವನ್ನು ಸಾರ್ವಭೌಮ, ಸಮಾಜವಾದಿ, ಜಾತ್ಯತೀತ, ಪ್ರಜಾಸತ್ತಾತ್ಮಕ ಗಣರಾಜ್ಯ ಎಂದು ಘೋಷಿಸುತ್ತದೆ. \"ಸಮಾಜವಾದಿ\" ಮತ್ತು \"ಜಾತ್ಯತೀತ\" ಪದಗಳನ್ನು 42ನೇ ತಿದ್ದುಪಡಿ (1976) ಮೂಲಕ ಸೇರಿಸಲಾಯಿತು. ನ್ಯಾಯ, ಸ್ವಾತಂತ್ರ್ಯ, ಸಮಾನತೆ ಮತ್ತು ಸೋದರತ್ವವನ್ನು ಖಾತ್ರಿಪಡಿಸುತ್ತದೆ. ಕೇಶವಾನಂದ ಭಾರತಿ ಪ್ರಕರಣದಲ್ಲಿ (1973) ಸುಪ್ರೀಂ ಕೋರ್ಟ್ ಪ್ರಸ್ತಾವನೆಯು ಸಂವಿಧಾನದ ಭಾಗ ಎಂದು ಹೇಳಿತು ಮತ್ತು ಸಂಸತ್ತು ಮೂಲ ರಚನೆಯನ್ನು ಬದಲಿಸುವಂತಿಲ್ಲ ಎಂದು ತೀರ್ಪು ನೀಡಿತು.\n\n೩. ಮೂಲಭೂತ ಹಕ್ಕುಗಳು (ಭಾಗ III, ವಿಧಿ 12-35)\nಆರು ಮೂಲಭೂತ ಹಕ್ಕುಗಳಿವೆ: ಸಮಾನತೆಯ ಹಕ್ಕು (14-18), ಸ್ವಾತಂತ್ರ್ಯದ ಹಕ್ಕು (19-22), ಶೋಷಣೆ ವಿರುದ್ಧದ ಹಕ್ಕು (23-24), ಧಾರ್ಮಿಕ ಸ್ವಾತಂತ್ರ್ಯದ ಹಕ್ಕು (25-28), ಸಾಂಸ್ಕೃತಿಕ ಮತ್ತು ಶೈಕ್ಷಣಿಕ ಹಕ್ಕುಗಳು (29-30) ಮತ್ತು ಸಾಂವಿಧಾನಿಕ ಪರಿಹಾರದ ಹಕ್ಕು (32). ವಿಧಿ 21 ಜೀವ ಮತ್ತು ವೈಯಕ್ತಿಕ ಸ್ವಾತಂತ್ರ್ಯವನ್ನು ರಕ್ಷಿಸುತ್ತದೆ; ವಿಧಿ 21A (86ನೇ ತಿದ್ದುಪಡಿ, 2002) 6 ರಿಂದ 14 ವರ್ಷದ ಮಕ್ಕಳಿಗೆ ಉಚಿತ ಮತ್ತು ಕಡ್ಡಾಯ ಶಿಕ್ಷಣ ನೀಡುತ್ತದೆ. ಅಂಬೇಡ್ಕರ್ ವಿಧಿ 32 ಅನ್ನು ಸಂವಿಧಾನದ ಹೃದಯ ಮತ್ತು ಆತ್ಮ ಎಂದರು. ರಿಟ್‌ಗಳು: ಹೇಬಿಯಸ್ ಕಾರ್ಪಸ್, ಮ್ಯಾಂಡಮಸ್, ಪ್ರೊಹಿಬಿಷನ್, ಸರ್ಷಿಯೊರಾರಿ ಮತ್ತು ಕ್ವೋ ವಾರಂಟೊ.\n\n೪. ನಿರ್ದೇಶಕ ತತ್ವಗಳು ಮತ್ತು ಮೂಲಭೂತ ಕರ್ತವ್ಯಗಳು\nನಿರ್ದೇಶಕ ತತ್ವಗಳು ಭಾಗ IV (ವಿಧಿ 36-51) ರಲ್ಲಿವೆ; ಇವು ನ್ಯಾಯಾಲಯದಲ್ಲಿ ಜಾರಿಗೊಳಿಸಲಾಗದ ಸರ್ಕಾರದ ಮಾರ್ಗದರ್ಶಿ ತತ್ವಗಳು (ಸಮಾನ ಕೆಲಸಕ್ಕೆ ಸಮಾನ ವೇತನ, ಗ್ರಾಮ ಪಂಚಾಯತ್ (ವಿಧಿ 40), ಏಕರೂಪ ನಾಗರಿಕ ಸಂಹಿತೆ (ವಿಧಿ 44)). ಮೂಲಭೂತ ಕರ್ತವ್ಯಗಳು ಭಾಗ IVA, ವಿಧಿ 51A ನಲ್ಲಿವೆ; ಸ್ವರಣ್ ಸಿಂಗ್ ಸಮಿತಿ ಶಿಫಾರಸಿನಂತೆ 42ನೇ ತಿದ್ದುಪಡಿಯಿಂದ ಸೇರಿಸಲಾಯಿತು. ಮೂಲತಃ 10 ಕರ್ತವ್ಯಗಳಿದ್ದವು; 86ನೇ ತಿದ್ದುಪಡಿ ಮಕ್ಕಳ ಶಿಕ್ಷಣಕ್ಕೆ ಸಂಬಂಧಿಸಿದ 11ನೇ ಕರ್ತವ್ಯವನ್ನು ಸೇರಿಸಿತು.\n\n೫. ಕೇಂದ್ರ ಕಾರ್ಯಾಂಗ\nರಾಷ್ಟ್ರಪತಿ ಒಕ್ಕೂಟದ ಮುಖ್ಯಸ್ಥರು; ಸಂಸತ್ತಿನ ಮತ್ತು ರಾಜ್ಯ ವಿಧಾನಸಭೆಗಳ ಚುನಾಯಿತ ಸದಸ್ಯರ ಚುನಾವಣಾ ಮಂಡಲದಿಂದ 5 ವರ್ಷಗಳ ಅವಧಿಗೆ ಪರೋಕ್ಷವಾಗಿ ಆಯ್ಕೆಯಾಗುತ್ತಾರೆ. ಕನಿಷ್ಠ ವಯಸ್ಸು 35. ಉಪರಾಷ್ಟ್ರಪತಿ ರಾಜ್ಯಸಭೆಯ ಪದನಿಮಿತ್ತ ಸಭಾಪತಿ. ಪ್ರಧಾನಮಂತ್ರಿ ಮಂತ್ರಿಮಂಡಲದ ಮುಖ್ಯಸ್ಥರು; ವಿಧಿ 75 ರಂತೆ ಮಂತ್ರಿಮಂಡಲ ಲೋಕಸಭೆಗೆ ಸಾಮೂಹಿಕವಾಗಿ ಜವಾಬ್ದಾರಿ. ಅಟಾರ್ನಿ ಜನರಲ್ (ವಿಧಿ 76) ಭಾರತದ ಅತ್ಯುನ್ನತ ಕಾನೂನು ಅಧಿಕಾರಿ.\n\n೬. ಸಂಸತ್ತು\nಸಂಸತ್ತು ರಾಷ್ಟ್ರಪತಿ, ರಾಜ್ಯಸಭೆ ಮತ್ತು ಲೋಕಸಭೆಯನ್ನು ಒಳಗೊಂಡಿದೆ. ಲೋಕಸಭೆಯಲ್ಲಿ ಗರಿಷ್ಠ 552 ಸದಸ್ಯರು, ಅವಧಿ 5 ವರ್ಷ. ರಾಜ್ಯಸಭೆಯಲ್ಲಿ ಗರಿಷ್ಠ 250 ಸದಸ್ಯರು; ಇದು ಶಾಶ್ವತ ಸದನ ಮತ್ತು ಪ್ರತಿ ಎರಡು ವರ್ಷಕ್ಕೆ ಮೂರನೇ ಒಂದು ಭಾಗ ಸದಸ್ಯರು ನಿವೃತ್ತರಾಗುತ್ತಾರೆ. ಹಣ ಮಸೂದೆಯನ್ನು ಲೋಕಸಭೆಯಲ್ಲಿ ಮಾತ್ರ ಮಂಡಿಸಬಹುದು. ಲೋಕಸಭೆಯ ಸ್ಪೀಕರ್ ಅಧ್ಯಕ್ಷತೆ ವಹಿಸುತ್ತಾರೆ. ವಿಧಿ 108 ರ ಜಂಟಿ ಅಧಿವೇಶನದ ಅಧ್ಯಕ್ಷತೆಯನ್ನು ಸ್ಪೀಕರ್ ವಹಿಸುತ್ತಾರೆ.\n\n೭. ನ್ಯಾಯಾಂಗ\nಸುಪ್ರೀಂ ಕೋರ್ಟ್ ಅತ್ಯುನ್ನತ ನ್ಯಾಯಾಲಯ; ಮೂಲ, ಮೇಲ್ಮನವಿ ಮತ್ತು ಸಲಹಾ ವ್ಯಾಪ್ತಿಯನ್ನು ಹೊಂದಿದೆ. ವಿಧಿ 214 ರಂತೆ ಪ್ರತಿ ರಾಜ್ಯ ಅಥವಾ ರಾಜ್ಯಗಳ ಗುಂಪಿಗೆ ಹೈಕೋರ್ಟ್ ಇದೆ. ಸುಪ್ರೀಂ ಕೋರ್ಟ್ ನ್ಯಾಯಾಧೀಶರು 65 ವರ್ಷಕ್ಕೆ, ಹೈಕೋರ್ಟ್ ನ್ಯಾಯಾಧೀಶರು 62 ವರ್ಷಕ್ಕೆ ನಿವೃತ್ತರಾಗುತ್ತಾರೆ. ಸಾರ್ವಜನಿಕ ಹಿತಾಸಕ್ತಿ ಮೊಕದ್ದಮೆ (PIL) ಮೂಲಕ ಯಾವುದೇ ನಾಗರಿಕರು ಸಾರ್ವಜನಿಕ ವಿಷಯಗಳಿಗೆ ನ್ಯಾಯಾಲಯ ಸಂಪರ್ಕಿಸಬಹುದು. ವಿಧಿ 235 ರಂತೆ ಅಧೀನ ನ್ಯಾಯಾಲಯಗಳ ಮೇಲ್ವಿಚಾರಣೆ ಹೈಕೋರ್ಟ್‌ನದು.\n\n೮. ರಾಜ್ಯ ಸರ್ಕಾರ ಮತ್ತು ಸ್ಥಳೀಯ ಸಂಸ್ಥೆಗಳು\nರಾಜ್ಯಪಾಲರನ್ನು ರಾಷ್ಟ್ರಪತಿ ನೇಮಿಸುತ್ತಾರೆ (ವಿಧಿ 155); ಮುಖ್ಯಮಂತ್ರಿ ಮಂತ್ರಿಮಂಡಲದ ಮುಖ್ಯಸ್ಥರು ಮತ್ತು ವಿಧಾನಸಭೆಗೆ ಜವಾಬ್ದಾರರು (ವಿಧಿ 164). ಕರ್ನಾಟಕದ ಶಾಸಕಾಂಗ ದ್ವಿಸದನ; ವಿಧಾನಸಭೆಯಲ್ಲಿ 224 ಸದಸ್ಯರು. 73ನೇ ತಿದ್ದುಪಡಿ (1992) ಪಂಚಾಯತ್ ರಾಜ್‌ಗೆ ಮತ್ತು 74ನೇ ತಿದ್ದುಪಡಿ ನಗರ ಸ್ಥಳೀಯ ಸಂಸ್ಥೆಗಳಿಗೆ ಸಾಂವಿಧಾನಿಕ ಸ್ಥಾನಮಾನ ನೀಡಿತು. ರಾಜ್ಯ ಚುನಾವಣಾ ಆಯೋಗ ಸ್ಥಳೀಯ ಸಂಸ್ಥೆಗಳ ಚುನಾವಣೆ ನಡೆಸುತ್ತದೆ.\n\n೯. ಸಾಂವಿಧಾನಿಕ ಸಂಸ್ಥೆಗಳು ಮತ್ತು ತುರ್ತುಪರಿಸ್ಥಿತಿ\nಸಾಂವಿಧಾನಿಕ ಸಂಸ್ಥೆಗಳು: ಚುನಾವಣಾ ಆಯೋಗ (ವಿಧಿ 324), UPSC (ವಿಧಿ 315), ರಾಜ್ಯ ಲೋಕಸೇವಾ ಆಯೋಗ, ಹಣಕಾಸು ಆಯೋಗ (ವಿಧಿ 280) ಮತ್ತು CAG (ವಿಧಿ 148). ತುರ್ತುಪರಿಸ್ಥಿತಿ ಉಪಬಂಧಗಳು ಭಾಗ XVIII ರಲ್ಲಿವೆ: ರಾಷ್ಟ್ರೀಯ ತುರ್ತುಪರಿಸ್ಥಿತಿ (ವಿಧಿ 352), ರಾಜ್ಯದಲ್ಲಿ ರಾಷ್ಟ್ರಪತಿ ಆಳ್ವಿಕೆ (ವಿಧಿ 356) ಮತ್ತು ಹಣಕಾಸು ತುರ್ತುಪರಿಸ್ಥಿತಿ (ವಿಧಿ 360). 44ನೇ ತಿದ್ದುಪಡಿ (1978) \"ಆಂತರಿಕ ಅಶಾಂತಿ\" ಬದಲು \"ಸಶಸ್ತ್ರ ದಂಗೆ\" ಎಂದು ಬದಲಿಸಿ ರಾಷ್ಟ್ರೀಯ ತುರ್ತುಪರಿಸ್ಥಿತಿಯ ದುರ್ಬಳಕೆ ತಡೆಯಿತು.\n\n೧೦. ಪರೀಕ್ಷಾ ಸಲಹೆಗಳು\nವಿಧಿ ಸಂಖ್ಯೆಗಳನ್ನು ವಿಷಯಗಳೊಂದಿಗೆ ನೆನಪಿಡಿ, ತಿದ್ದುಪಡಿಗಳ ಪಟ್ಟಿ ಸಿದ್ಧಪಡಿಸಿ (7, 42, 44, 52, 73, 74, 86, 101ನೇ), ಕೇಶವಾನಂದ ಭಾರತಿ, ಮೇನಕಾ ಗಾಂಧಿ ಮತ್ತು ಮಿನರ್ವಾ ಮಿಲ್ಸ್ ಪ್ರಕರಣಗಳನ್ನು ಪುನರಾವರ್ತಿಸಿ. KPSC, KEA ಮತ್ತು SSC ಹಿಂದಿನ ಪ್ರಶ್ನೆಪತ್ರಿಕೆಗಳಿಂದ ಪ್ರತಿದಿನ 10 ರಾಜ್ಯಶಾಸ್ತ್ರ MCQ ಅಭ್ಯಾಸ ಮಾಡಿ."];
KN["Karnataka History and Culture: Complete Notes"]=["ಕರ್ನಾಟಕ ಇತಿಹಾಸ ಮತ್ತು ಸಂಸ್ಕೃತಿ: ಸಂಪೂರ್ಣ ಟಿಪ್ಪಣಿಗಳು","೧. ಆರಂಭಿಕ ಕರ್ನಾಟಕ\nಕರ್ನಾಟಕದಲ್ಲಿ ಹಿರೇಬೆಣಕಲ್ ಮತ್ತು ಬ್ರಹ್ಮಗಿರಿಯಂತಹ ಶಿಲಾಯುಗ ಮತ್ತು ಮಹಾಶಿಲಾಯುಗ ತಾಣಗಳಿವೆ. ಮಸ್ಕಿ, ಬ್ರಹ್ಮಗಿರಿ ಮತ್ತು ಸಿದ್ದಾಪುರದ ಅಶೋಕನ ಶಾಸನಗಳು ಮೌರ್ಯರ ಪ್ರಭಾವವನ್ನು ತೋರಿಸುತ್ತವೆ. ಸ್ಥಳೀಯ ರಾಜವಂಶಗಳು ಉದಯಿಸುವ ಮೊದಲು ಸಾತವಾಹನರು ಉತ್ತರ ಕರ್ನಾಟಕದ ಭಾಗಗಳನ್ನು ಆಳಿದರು.\n\n೨. ಕದಂಬರು ಮತ್ತು ಗಂಗರು\nಬನವಾಸಿಯ ಕದಂಬರು, 4ನೇ ಶತಮಾನದಲ್ಲಿ ಮಯೂರಶರ್ಮ ಸ್ಥಾಪಿಸಿದ, ಮೊದಲ ಕನ್ನಡ ರಾಜವಂಶ; ಕನ್ನಡವನ್ನು ಆಡಳಿತ ಭಾಷೆಯನ್ನಾಗಿ ಮಾಡಿದರು. ತಲಕಾಡಿನ ಪಶ್ಚಿಮ ಗಂಗರು 4ರಿಂದ 11ನೇ ಶತಮಾನದವರೆಗೆ ಆಳಿದರು. ಗಂಗ ಮಂತ್ರಿ ಚಾವುಂಡರಾಯ ಸುಮಾರು 981ರಲ್ಲಿ ಶ್ರವಣಬೆಳಗೊಳದ ಗೊಮ್ಮಟೇಶ್ವರ ಏಕಶಿಲಾ ಮೂರ್ತಿಯನ್ನು ನಿರ್ಮಿಸಿದನು.\n\n೩. ಬಾದಾಮಿ ಚಾಲುಕ್ಯರು\nಇಮ್ಮಡಿ ಪುಲಿಕೇಶಿ (7ನೇ ಶತಮಾನ) ಅತ್ಯಂತ ಶ್ರೇಷ್ಠ ಚಾಲುಕ್ಯ ದೊರೆ; ನರ್ಮದಾ ನದಿ ತೀರದಲ್ಲಿ ಹರ್ಷವರ್ಧನನನ್ನು ಸೋಲಿಸಿದನು. ರವಿಕೀರ್ತಿಯ ಐಹೊಳೆ ಶಾಸನ ಅವನ ವಿಜಯಗಳನ್ನು ದಾಖಲಿಸುತ್ತದೆ. ಬಾದಾಮಿ, ಐಹೊಳೆ ಮತ್ತು ಪಟ್ಟದಕಲ್ಲಿನಲ್ಲಿ ದೇವಾಲಯ ವಾಸ್ತುಶಿಲ್ಪ ವಿಕಸಿಸಿತು; ಪಟ್ಟದಕಲ್ಲು ಯುನೆಸ್ಕೋ ವಿಶ್ವ ಪರಂಪರೆ ತಾಣ. ಇಮ್ಮಡಿ ವಿಕ್ರಮಾದಿತ್ಯನ ರಾಣಿಯರು ವಿರೂಪಾಕ್ಷ ಮತ್ತು ಮಲ್ಲಿಕಾರ್ಜುನ ದೇವಾಲಯಗಳನ್ನು ಕಟ್ಟಿಸಿದರು.\n\n೪. ರಾಷ್ಟ್ರಕೂಟರು\nದಂತಿದುರ್ಗ ಸ್ಥಾಪಿಸಿದ ಮಾನ್ಯಖೇಟದ ರಾಷ್ಟ್ರಕೂಟರು ಮೊದಲನೇ ಕೃಷ್ಣನ ಕಾಲದಲ್ಲಿ ಎಲ್ಲೋರಾದ ಕೈಲಾಸ ದೇವಾಲಯವನ್ನು ಕಟ್ಟಿಸಿದರು. ಮೊದಲನೇ ಅಮೋಘವರ್ಷನಿಗೆ ಕವಿರಾಜಮಾರ್ಗ, ಲಭ್ಯವಿರುವ ಅತ್ಯಂತ ಹಳೆಯ ಕನ್ನಡ ಕೃತಿ, ಸಂಬಂಧಿಸಿದೆ. ಇವರ ಕಾಲ ಕನ್ನಡ ಸಾಹಿತ್ಯದ ಸುವರ್ಣ ಯುಗ.\n\n೫. ಕಲ್ಯಾಣ ಚಾಲುಕ್ಯರು, ಹೊಯ್ಸಳರು ಮತ್ತು ಕಲಚುರಿಗಳು\nಕಲ್ಯಾಣದ ಪಶ್ಚಿಮ ಚಾಲುಕ್ಯರು ಬಸವಕಲ್ಯಾಣದಿಂದ ಆಳಿದರು. ಆರನೇ ವಿಕ್ರಮಾದಿತ್ಯ ಮಹಾನ್ ದೊರೆ; ಬಿಲ್ಹಣ ಮತ್ತು ವಿಜ್ಞಾನೇಶ್ವರ ಅವನ ಆಸ್ಥಾನ ಅಲಂಕರಿಸಿದರು. ಬೇಲೂರು ಮತ್ತು ಹಳೇಬೀಡು ರಾಜಧಾನಿಗಳಾಗಿದ್ದ ಹೊಯ್ಸಳರು, ವಿಷ್ಣುವರ್ಧನ ಅತ್ಯಂತ ಪ್ರಸಿದ್ಧ ದೊರೆ, ನಕ್ಷತ್ರಾಕಾರದ ದೇವಾಲಯಗಳನ್ನು ಕಟ್ಟಿಸಿದರು: ಚೆನ್ನಕೇಶವ (ಬೇಲೂರು), ಹೊಯ್ಸಳೇಶ್ವರ (ಹಳೇಬೀಡು), ಕೇಶವ (ಸೋಮನಾಥಪುರ). ಕಲಚುರಿಗಳ ಅಡಿಯಲ್ಲಿ ಮಂತ್ರಿಯಾಗಿದ್ದ ಬಸವಣ್ಣ ಲಿಂಗಾಯತ ಚಳವಳಿ ಮತ್ತು ವಚನ ಸಾಹಿತ್ಯವನ್ನು ಮುನ್ನಡೆಸಿದರು.\n\n೬. ವಿಜಯನಗರ ಸಾಮ್ರಾಜ್ಯ\nವಿದ್ಯಾರಣ್ಯರ ಪ್ರೇರಣೆಯಿಂದ 1336ರಲ್ಲಿ ಹರಿಹರ ಮತ್ತು ಬುಕ್ಕರಿಂದ ಸ್ಥಾಪನೆ; ರಾಜಧಾನಿ ಹಂಪಿ. ಕೃಷ್ಣದೇವರಾಯ (1509-1529) ಅತ್ಯಂತ ಶ್ರೇಷ್ಠ ದೊರೆ, \"ಕನ್ನಡ ರಾಜ್ಯ ರಮಾರಮಣ\" ಎಂದು ಹೆಸರಾದ; ತೆಲುಗಿನಲ್ಲಿ ಆಮುಕ್ತಮಾಲ್ಯದ ಬರೆದನು. ವಿದೇಶಿ ಪ್ರವಾಸಿಗರಾದ ಡೊಮಿಂಗೊ ಪಾಯಿಸ್, ನ್ಯೂನಿಜ್ ಮತ್ತು ಅಬ್ದುರ್ ರಜಾಕ್ ಭೇಟಿ ನೀಡಿದರು. 1565ರ ತಾಳಿಕೋಟೆ ಯುದ್ಧದ ನಂತರ ಸಾಮ್ರಾಜ್ಯ ಪತನವಾಯಿತು.\n\n೭. ಬಹಮನಿ, ಆದಿಲ್‌ಶಾಹಿಗಳು, ಮೈಸೂರು ಮತ್ತು ಆಧುನಿಕ ಕರ್ನಾಟಕ\nಬಹಮನಿ ಸುಲ್ತಾನರು ಮತ್ತು ನಂತರ ಬಿಜಾಪುರದ ಆದಿಲ್‌ಶಾಹಿಗಳು ಗೋಲ ಗುಮ್ಮಟದಂತಹ ಸ್ಮಾರಕಗಳನ್ನು ಕಟ್ಟಿಸಿದರು; ಇದರ ಗುಮ್ಮಟ ವಿಶ್ವದ ಅತಿ ದೊಡ್ಡವುಗಳಲ್ಲಿ ಒಂದು. ಮೈಸೂರಿನ ಒಡೆಯರು ಶತಮಾನಗಳ ಕಾಲ ಆಳಿದರು; ಹೈದರ್ ಅಲಿ ಮತ್ತು ಟಿಪ್ಪು ಸುಲ್ತಾನ್ (1799ರಲ್ಲಿ ನಾಲ್ಕನೇ ಆಂಗ್ಲೋ-ಮೈಸೂರು ಯುದ್ಧದಲ್ಲಿ ಮರಣ) ಬ್ರಿಟಿಷರನ್ನು ಎದುರಿಸಿದರು. ಏಕೀಕರಣ ಚಳವಳಿಯ ಫಲವಾಗಿ 1 ನವೆಂಬರ್ 1956ರಂದು ಕರ್ನಾಟಕ ರಚನೆಯಾಯಿತು; 1973ರಲ್ಲಿ ಕರ್ನಾಟಕ ಎಂಬ ಹೆಸರು ಸ್ವೀಕರಿಸಲಾಯಿತು.\n\n೮. ಸಂಸ್ಕೃತಿ ಮತ್ತು ಸಾಹಿತ್ಯ\nಪಂಪ, ಪೊನ್ನ ಮತ್ತು ರನ್ನ ಕನ್ನಡ ಸಾಹಿತ್ಯದ ರತ್ನತ್ರಯರು. ಬಸವಣ್ಣ, ಅಕ್ಕಮಹಾದೇವಿ ಮತ್ತು ಅಲ್ಲಮಪ್ರಭು ಪ್ರಮುಖ ವಚನಕಾರರು. ಹರಿದಾಸ ಸಾಹಿತ್ಯವನ್ನು ಕರ್ನಾಟಕ ಸಂಗೀತದ ಪಿತಾಮಹ ಪುರಂದರದಾಸ ಮತ್ತು ಕನಕದಾಸ ಮುನ್ನಡೆಸಿದರು. ಆಧುನಿಕ ದಿಗ್ಗಜರಾದ ಕುವೆಂಪು, ಬೇಂದ್ರೆ, ಶಿವರಾಮ ಕಾರಂತ, ಮಾಸ್ತಿ, ಗೋಕಾಕ್, ಯು.ಆರ್. ಅನಂತಮೂರ್ತಿ, ಗಿರೀಶ್ ಕಾರ್ನಾಡ್ ಮತ್ತು ಚಂದ್ರಶೇಖರ ಕಂಬಾರ ಒಟ್ಟಾಗಿ 8 ಜ್ಞಾನಪೀಠ ಪ್ರಶಸ್ತಿ ಗೆದ್ದಿದ್ದಾರೆ. ಯಕ್ಷಗಾನ ಕರಾವಳಿ ಕರ್ನಾಟಕದ ಸಾಂಪ್ರದಾಯಿಕ ರಂಗಭೂಮಿ; ಮೈಸೂರು ದಸರಾ ನಾಡಹಬ್ಬ.\n\n೯. ಪರೀಕ್ಷಾ ಸಲಹೆಗಳು\nಸ್ಥಾಪಕ, ರಾಜಧಾನಿ, ಶ್ರೇಷ್ಠ ದೊರೆ ಮತ್ತು ಸ್ಮಾರಕಗಳೊಂದಿಗೆ ರಾಜವಂಶದ ಪಟ್ಟಿ ಮಾಡಿ. ಕದಂಬರು, ಗಂಗರು, ಚಾಲುಕ್ಯರು, ರಾಷ್ಟ್ರಕೂಟರು, ಹೊಯ್ಸಳರು, ವಿಜಯನಗರ ಕ್ರಮವನ್ನು ನೆನಪಿಡಿ. ಕರ್ನಾಟಕದ ಯುನೆಸ್ಕೋ ತಾಣಗಳನ್ನು ಪುನರಾವರ್ತಿಸಿ: ಹಂಪಿ, ಪಟ್ಟದಕಲ್ಲು, ಪಶ್ಚಿಮ ಘಟ್ಟಗಳು ಮತ್ತು ಹೊಯ್ಸಳ ದೇವಾಲಯಗಳು."];
